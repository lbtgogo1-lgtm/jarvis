name: jarvis-web
services:
  searxng:
    # Official SearXNG 2026.10.25-54ca1d9cf; digest locks the tested image.
    image: searxng/searxng@sha256:23482d8ecf7ddf66029479468ea04c1bb11d2b65785a17a7e629e2ffd13296ca
    ports:
      - "127.0.0.1:8080:8080"
    user: "977:977"
    environment:
      FORCE_OWNERSHIP: "false"
      GRANIAN_WORKERS: "1"
    volumes:
      - ./data/searxng/settings.yml:/etc/searxng/settings.yml:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/searxng:uid=977,gid=977,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/config', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
